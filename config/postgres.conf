# High-performance PostgreSQL configuration tuned for 8 GiB RAM and 2 vCPU
listen_addresses = '*'
max_connections = 100

# Memory settings (Host: 8 GiB, allocating ~3.5 GiB to Postgres)
shared_buffers = 2GB
effective_cache_size = 4GB
work_mem = 32MB
maintenance_work_mem = 256MB

# Write-Ahead Log (WAL) & Disk settings
wal_buffers = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 4GB
min_wal_size = 1GB

# synchronous_commit = off flushes WAL asynchronously to disk (every 20ms)
# eliminating disk fsync bottleneck on gp3 SSD (3000 IOPS limit)
synchronous_commit = off
wal_writer_delay = 20ms
commit_delay = 0

# Disk / Storage optimizations for AWS gp3 SSD
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

